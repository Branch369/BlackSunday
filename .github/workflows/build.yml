name: Build Black Sunday

# Builds the Macintosh application with Retro68 on every push, and on demand
# from the Actions tab ("Run workflow"). The result is attached to the run as
# a downloadable artifact named BlackSunday.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Retro68
        run: |
          docker run --rm -v "$PWD":/root -i ghcr.io/autc04/retro68 /bin/bash <<"EOF"
          set -e
          # Works whether the project files sit at the top of the repository
          # or one folder down.
          cd "$(dirname "$(find /root -maxdepth 2 -name CMakeLists.txt | head -n 1)")"
          rm -rf build && mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/m68k-apple-macos/cmake/retro68.toolchain.cmake
          make
          ls -la
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: BlackSunday
          if-no-files-found: error
          path: |
            **/build/BlackSunday.dsk
            **/build/BlackSunday.bin
